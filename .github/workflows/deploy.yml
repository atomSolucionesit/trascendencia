name: Deploy to Plesk

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy Next.js App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3000/api' }}
          NEXT_PUBLIC_COMPANY_TOKEN: ${{ secrets.NEXT_PUBLIC_COMPANY_TOKEN || '2be3d1b6-39d8-4ac0-916d-148f63214b42' }}
          NEXT_PUBLIC_COMPANY_ID: ${{ secrets.NEXT_PUBLIC_COMPANY_ID || '26' }}

      - name: Prepare Deployment Bundle
        run: |
          # Create deployment folder
          mkdir -p deploy/.next
          
          # Copy standalone server and its dependencies
          cp -r .next/standalone/. deploy/
          
          # Copy public assets and static files if they exist
          if [ -d "public" ]; then
            cp -r public deploy/
          fi
          
          if [ -d ".next/static" ]; then
            cp -r .next/static deploy/.next/
          fi
          
          # Copy .htaccess if it exists
          if [ -f ".htaccess" ]; then
            cp .htaccess deploy/
          fi
          
          # Create tmp folder and restart.txt to trigger Passenger restart in Plesk
          mkdir -p deploy/tmp
          touch deploy/tmp/restart.txt

      - name: Deploy to Plesk via FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }} # Default to FTP (Port 21)
          local-dir: ./deploy/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/httpdocs/' }}
          # Exclude files if needed (e.g. .git)
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**/.git*
