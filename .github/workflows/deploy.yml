name: Deploy to Plesk

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy Next.js App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build

      - name: Prepare Deployment Bundle
        run: |
          # Create deployment folder
          mkdir -p deploy/.next
          
          # Copy standalone server and its dependencies
          cp -r .next/standalone/. deploy/
          
          # Copy public assets and static files if they exist
          if [ -d "public" ]; then
            cp -r public deploy/
          fi
          
          if [ -d ".next/static" ]; then
            cp -r .next/static deploy/.next/
          fi
          
          # Create tmp folder and restart.txt to trigger Passenger restart in Plesk
          mkdir -p deploy/tmp
          touch deploy/tmp/restart.txt

      - name: Deploy to Plesk via SFTP/FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 22 }} # Default to SFTP (Port 22)
          protocol: ${{ secrets.FTP_PROTOCOL || 'sftp' }} # sftp or ftp
          local-dir: ./deploy/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/httpdocs/' }}
          # Exclude files if needed (e.g. .git)
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**/.git*
